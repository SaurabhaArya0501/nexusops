<div class="shell">
  <header class="shell__header">
    <span class="shell__brand">NexusOps</span>
  </header>
  <div class="shell__body" [class.shell__body--sidebar-collapsed]="sidebarCollapsed()">
    <app-sidebar [(collapsed)]="sidebarCollapsed" />
    <main class="shell__content">
      <ul class="ticket-list">
        @for (ticket of tickets; track ticket.id) {
          <app-ticket-card [ticket]="ticket" (selected)="onTicketSelected($event)" />
        } @empty {
          <li class="empty-state">No tickets found</li>
        }
      </ul>
    </main>
  </div>
</div>
