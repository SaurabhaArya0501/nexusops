<div class="shell">
  <header class="shell__header">
    <span class="shell__brand">NexusOps</span>
  </header>
  <div class="shell__body">
    <nav class="shell__sidebar" aria-label="Primary">
      <!-- nav links land here on Day 3 / weekend -->
    </nav>
    <main class="shell__content">
      <ul class="ticket-list">
        @for (ticket of tickets; track ticket.id) {
          <app-ticket-card [ticket]="ticket" (selected)="onTicketSelected($event)" />
        } @empty {
          <li class="empty-state">No tickets found</li>
        }
      </ul>
    </main>
  </div>
</div>
