<div class="tickets-toolbar">
  <div class="tickets-toolbar__chips">
    @for (option of statusOptions; track option) {
      <button
        type="button"
        class="tickets-toolbar__chip"
        [class.tickets-toolbar__chip--active]="store.statusFilter() === option"
        [attr.aria-pressed]="store.statusFilter() === option"
        (click)="store.setStatusFilter(option)"
      >
        {{ option }}
      </button>
    }
  </div>
  <div class="tickets-toolbar__search">
    <input
      type="search"
      class="tickets-toolbar__input"
      placeholder="Filter by title"
      aria-label="Filter tickets by title"
      [value]="store.query()"
      (input)="onQueryInput($event)"
    />
    @if (store.query()) {
      <button
        type="button"
        class="tickets-toolbar__clear"
        aria-label="Clear filter text"
        (click)="store.setQuery('')"
      >
        ×
      </button>
    }
  </div>
  <label class="tickets-toolbar__sort">
    <span class="tickets-toolbar__sort-label">Sort</span>
    <select
      class="tickets-toolbar__select"
      [value]="store.sortBy()"
      (change)="onSortChange($event)"
    >
      @for (option of sortOptions; track option) {
        <option [value]="option" [selected]="option === store.sortBy()">{{ option }}</option>
      }
    </select>
  </label>
</div>
<ul class="ticket-list">
  @for (ticket of store.visibleTickets(); track ticket.id) {
    <app-ticket-card [ticket]="ticket" [showStatus]="store.statusFilter() === 'all'" />
  } @empty {
    <div class="tickets-empty">
      <p>No tickets match your filters.</p>
      <button type="button" (click)="store.clearFilters()">Clear filters</button>
    </div>
  }
</ul>
