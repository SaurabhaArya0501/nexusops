<div class="dashboard">
  <h1 class="dashboard__title">Dashboard</h1>

  @if (store.isLoading()) {
    <p class="dashboard__status" role="status">Loading…</p>
  } @else if (store.errorMessage(); as message) {
    <app-error-panel [message]="message" (retry)="store.reload()" />
  } @else {
    <div class="dashboard__stats">
      <div class="dashboard__stats">
        <div class="stat-card stat-card--total">
          <span class="stat-card__count">{{ store.total() }}</span>
          <span class="stat-card__label">All</span>
        </div>

        @for (status of statuses; track status) {
          <div class="stat-card">
            <span class="stat-card__count">{{ store.counts()[status] }}</span>
            <span class="stat-card__label">{{ status }}</span>
          </div>
        }
      </div>
    </div>
  }
</div>
